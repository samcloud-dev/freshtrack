# FreshTrack CI: one run per push or pull request, three jobs.
#   checks     - api: lint, test (real PostgreSQL), scan code, build, prove /health, scan image
#   web-checks - web: lint, test, scan code, build, prove /health, scan image (not shipped yet)
#   ship       - main only: push the exact scanned api image to Docker Hub, tagged with the git SHA
# A failed step skips the steps after it. Details: docs/architecture.md, section 9.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]

# The workflow token can read the repo, never change it.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Throwaway PostgreSQL for the integration tests, same image as the cluster.
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: test # disposable test database, never real data
          POSTGRES_DB: freshtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no Git token left on the runner

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Wheels only, every file checked against its hash.
      - name: Install our tools (locked)
        run: "pip install --only-binary :all: --require-hashes -r api/requirements-dev.txt"

      # CHECK
      - name: Lint
        run: ruff check api/
      - name: Format check
        run: ruff format --check api/

      # TEST: unit + integration against the PostgreSQL above.
      - name: Tests (unit + integration)
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/freshtrack_test
        run: pytest -v

      # SCAN CODE: risky Python (bandit; tests use assert on purpose),
      # then vulnerable packages and secrets in the whole repo, api and web (Trivy, pinned by digest).
      - name: Scan our code (bandit)
        run: bandit -r api/ -x api/tests
      - name: Scan packages and secrets (Trivy)
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          fs --scanners vuln,secret --exit-code 1 /src

      # BUILD: tagged with the commit SHA, so every image traces back to its code.
      - name: Build the api image
        run: docker build -t "freshtrack-api:$GITHUB_SHA" api/

      # PROVE: start it and require /health (curl retries while gunicorn starts).
      - name: Prove the image starts (/health)
        run: |
          docker run -d --name ft-api -p 8000:8000 "freshtrack-api:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8000/health

      # SCAN IMAGE: Trivy reads a saved file, never the Docker socket.
      # Report = every severity, never fails. Gate = fails on fixable HIGH/CRITICAL.
      - name: Save the image to a file
        run: docker save "freshtrack-api:$GITHUB_SHA" -o "$RUNNER_TEMP/image.tar"
      - name: Scan the image - full report (Trivy)
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/image.tar:/image.tar:ro"
          -v "$RUNNER_TEMP/trivy-cache:/cache"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --cache-dir /cache --scanners vuln,secret --input /image.tar
      - name: Scan the image - gate (Trivy)
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/image.tar:/image.tar:ro"
          -v "$RUNNER_TEMP/trivy-cache:/cache"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --cache-dir /cache --skip-db-update --scanners vuln,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --input /image.tar

      # Main only: hand the scanned image to the ship job (other branches never ship).
      - name: Hand the image to the ship job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Show container logs
        if: always()
        run: docker logs ft-api

  # web: same QC as the api, except ship. No database, no secrets: the tests use a fake api.
  web-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install web tools (locked)
        run: "pip install --only-binary :all: --require-hashes -r web/requirements-dev.txt"

      - name: Lint (web)
        run: ruff check web/
      - name: Format check (web)
        run: ruff format --check web/

      - name: Tests (web)
        working-directory: web
        run: pytest -v

      - name: Scan web code (bandit)
        run: bandit -r web/ -x web/tests

  # BUILD: tagged with the commit SHA.
      - name: Build the web image
        run: docker build -t "freshtrack-web:$GITHUB_SHA" web/

  # PROVE: web refuses to start without SECRET_KEY and API_URL, so pass throwaway values.
      # /health never calls the api, so a fake api address is enough here.
      - name: Prove the web image starts (/health)
        run: |
          docker run -d --name ft-web -p 8000:8000 \
            -e SECRET_KEY=ci-throwaway-value -e API_URL=http://api.invalid \
            "freshtrack-web:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8000/health

   # SCAN IMAGE: same Trivy report and gate as the api.
      - name: Save the web image to a file
        run: docker save "freshtrack-web:$GITHUB_SHA" -o "$RUNNER_TEMP/web-image.tar"
      - name: Scan the web image - full report (Trivy)
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/web-image.tar:/image.tar:ro"
          -v "$RUNNER_TEMP/trivy-cache:/cache"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --cache-dir /cache --scanners vuln,secret --input /image.tar
      - name: Scan the web image - gate (Trivy)
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/web-image.tar:/image.tar:ro"
          -v "$RUNNER_TEMP/trivy-cache:/cache"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --cache-dir /cache --skip-db-update --scanners vuln,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --input /image.tar

      - name: Show web container logs
        if: always()
        run: docker logs ft-web
        
  # SHIP: push the exact scanned image to Docker Hub. Only on a push to main.
  ship:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dockerhub # token lives here; only main can use it
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/freshtrack-api
    steps:
      - name: Get the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}

      - name: Load the image into Docker
        run: docker load -i "$RUNNER_TEMP/image.tar"

      - name: Tag the image for Docker Hub
        run: docker tag "freshtrack-api:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"

      # Token through stdin, so it never appears in the command line or logs.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push the image
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout
