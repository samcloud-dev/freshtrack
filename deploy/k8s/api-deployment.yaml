# FreshTrack api: one Pod running the scanned image from Docker Hub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: freshtrack
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: freshtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: freshtrack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: freshtrack
    spec:
      # The api never talks to the Kubernetes API, so it gets no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Tag = git commit, digest = the exact bytes CI scanned and shipped.
          image: samayohub/freshtrack-api:627d2a69ed029891a637a40a50e1d161f31b7849@sha256:75618b3ff72a2814b61d18e873047c451758350c8a3168e28eea98364f8f5976
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Where the database is; read from the Secret, never written in Git.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
              ephemeral-storage: 256Mi
          # Started = has the app finished booting? The other probes wait for this.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Ready = can take traffic (needs the database).
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Alive = the process answers. Never checks the database.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
