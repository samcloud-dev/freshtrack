apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: freshtrack
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: freshtrack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: freshtrack
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
